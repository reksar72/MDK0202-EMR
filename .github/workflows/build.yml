name: CSharp checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Emr.sln
      - run: dotnet build Emr.sln --configuration Release --no-restore
      - run: dotnet run --project tests/AIS.Tests --configuration Release --no-build -- verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification/
