openapi: 3.0.3
info:
  title: EMR Integration Gateway
  version: 1.0.0
  description: Учебный контракт. Личность и роль определяются сервером по Bearer-токену; поля actorId
    и role в запросе запрещены.
servers:
- url: http://127.0.0.1:5274
  description: Только локальный учебный стенд
- url: https://emr.example.invalid
  description: Шаблон адреса рабочего контура; не действующий сервис
security:
- BearerAuth: []
paths:
  /api/v1/patients/{id}/summary:
    get:
      operationId: getPatientSummary
      summary: Получить краткую карту назначенного пациента
      parameters:
      - name: id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
          description: Непустой UUID
      responses:
        '200':
          description: Краткая карта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
        '401': &id001
          description: Ошибка API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403': *id001
        '404': *id001
  /api/v1/access/check:
    post:
      operationId: checkAccess
      summary: Проверить доступ к назначенной карте по цели обращения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
            example:
              requestId: 33333333-3333-4333-8333-333333333333
              patientId: 11111111-1111-4111-8111-111111111111
              purpose: Treatment
              workstationId: PC-001
      responses:
        '200':
          description: Доступ разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReply'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '415': *id001
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Токен учебного сервера выдаётся при старте; для рабочего контура нужен доверенный IdP.
  schemas:
    AccessRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - patientId
      - purpose
      - workstationId
      properties:
        requestId: *id002
        patientId: *id002
        purpose:
          type: string
          enum:
          - Treatment
          - NursingCare
        workstationId:
          type: string
          pattern: ^[A-Z]{2}-[0-9]{3}$
          example: PC-001
          minLength: 6
          maxLength: 6
    AccessReply:
      type: object
      additionalProperties: false
      required:
      - requestId
      - patientId
      - decision
      - scope
      properties:
        requestId: *id002
        patientId: *id002
        decision:
          type: string
          enum:
          - allow
        scope:
          type: string
          enum:
          - summary
    PatientSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - fullName
      - birthDate
      - sex
      - note
      properties:
        id: *id002
        fullName:
          type: string
          minLength: 3
          maxLength: 150
        birthDate:
          type: string
          format: date
        sex:
          type: string
          enum:
          - M
          - F
          - U
        note:
          type: string
          description: Учебный текст без медицинских рекомендаций
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
